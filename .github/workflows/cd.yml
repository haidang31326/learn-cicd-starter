jobs:
  Deploy:
    runs-on: ubuntu-latest

    # 1. THÊM BIẾN MÔI TRƯỜNG Ở ĐÂY (Cấp độ Job)
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    # (Giữ nguyên phần permissions của bạn ở đây)
    permissions:
      packages: write
      contents: read

    steps:
      # Bước 1: Lấy code về
      - name: Check out code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Go (Bắt buộc phải có để chạy lệnh go install)
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 2. CÀI ĐẶT GOOSE NGAY SAU KHI LẤY CODE
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      # (Giữ nguyên Bước 3: Build app của bạn...)
      
      # (Giữ nguyên Bước 4: Log in to GitHub Container Registry...)

      # (Giữ nguyên Bước 5: Build Docker image and Push...)

      # 3. CHẠY MIGRATION Ở ĐÂY (Sau khi build Docker, trước khi Deploy)
      - name: Run Migrations
        run: ./scripts/migrateup.sh
        # KHÔNG cần khai báo env ở đây nữa vì đã khai báo ở đầu file rồi

      # (Giữ nguyên Bước 6: Deploy - Fake Cloud Build cho Boot.dev...)
