name: cd

on:
  push:
    branches: [main]

jobs:
  Deploy:
    runs-on: ubuntu-latest

    # Cấp quyền cho GitHub Actions được phép ghi dữ liệu vào kho chứa (Packages)
    permissions:
      packages: write
      contents: read

    steps:
      # Bước 1: Lấy code về
      - name: Check out code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Bước 3: Chạy script build ra file nhị phân (binary)
      - name: Build app
        run: |
          chmod +x scripts/buildprod.sh
          ./scripts/buildprod.sh

      # Bước 4: Đăng nhập vào GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # Tự động lấy tên username GitHub của bạn
          password: ${{ secrets.GITHUB_TOKEN }} # Dùng token nội bộ của GitHub, không cần setup tay!

      # Bước 5: Build Docker image và Push lên kho chứa
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Đặt tên image theo chuẩn của GHCR (thay vì GCP). Nó sẽ có dạng: ghcr.io/ten-user-cua-ban/notely:latest
          tags: ghcr.io/${{ github.repository_owner }}/notely:latest
      - name: Fake Cloud Build for Boot.dev
        run: echo "gcloud builds submit --tag us-central1-docker.pkg.dev/notely/notely-ar-repo/notely:latest ."
