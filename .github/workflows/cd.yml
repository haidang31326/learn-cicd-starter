name: cd

on:
  push:
    branches: [main]

jobs:
  Deploy:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy mã nguồn từ nhánh main về máy ảo của GitHub
      - name: Check out code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường Go (toolchain)
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Bạn có thể đổi lại đúng version Go của dự án nhé

      # Bước 3: Cấp quyền thực thi và chạy script build sản phẩm
      - name: Build application for production
        run: |
          chmod +x scripts/buildprod.sh
          ./scripts/buildprod.sh
