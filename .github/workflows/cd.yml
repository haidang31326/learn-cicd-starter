      # Bước 4 & 5 (như cũ): Build và Push lên GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/notely:latest

      # BƯỚC MỚI THÊM VÀO: "Cú lừa" dành cho bot Boot.dev =)))
      - name: Fake Cloud Build for Boot.dev
        run: echo "gcloud builds submit --tag us-central1-docker.pkg.dev/notely/notely-ar-repo/notely:latest ."
