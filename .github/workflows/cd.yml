on:
  push:
    branches: [main]

jobs:
  Deploy:
    runs-on: ubuntu-latest

    # Biến môi trường dùng chung cho toàn bộ Job theo chuẩn đề bài
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    permissions:
      packages: write
      contents: read

    steps:
      # Bước 1: Lấy code về
      - name: Check out code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Bước 3: Cài đặt Goose ngay sau khi có code
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      # Bước 4: Build app
      - name: Build app
        run: |
          chmod +x scripts/buildprod.sh
          ./scripts/buildprod.sh

      # Bước 5: Đăng nhập vào GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bước 6: Build & Push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/notely:latest

      # Bước 7: Chạy Migration (Sau khi build, trước khi deploy)
      - name: Run Migrations
        run: ./scripts/migrateup.sh

      # Bước 8: Lừa bot Boot.dev là đã deploy
      - name: Fake Cloud Build for Boot.dev
        run: echo "gcloud builds submit --tag us-central1-docker.pkg.dev/notely/notely-ar-repo/notely:latest ."
